# QuMol badges. Edit titles, icons, hints and thresholds here; the server re-reads this file
# when it changes, so no restart is needed. Badges are worked out from what players have
# already done, so existing players get every badge they have earned straight away.
#
# A ladder has tiers: a player earns each tier when their count reaches `at`.
#   stat: molecules  distinct stable molecules built (cooked ones not included)
#         puzzles    distinct puzzles solved for points (practice solves don't count)
#         cooked     molecules served from the cauldron
#         points     the ⭐ total
#
# A badge is a one-off achievement. Its `rule` is one of:
#   smiles:<SMILES>[,<SMILES>...]  built one of these molecules (RDKit canonical SMILES, no H)
#   bond:2 / bond:3                built a molecule with a double / triple bond
#   ring                           built a molecule with a ring
#   accident                       the cauldron made something you never built by hand
#   event:<name>                   the game reported it (events: lesson, quiz)
# `key` is the badge's id; once players have it, change the title and icon freely but keep the key.

[[ladder]]
key = "builder"
name = "Molecule builder"
stat = "molecules"
unit = "molecules built"
tiers = [
  { at = 1,   icon = "🍼", title = "Baby Bonder" },
  { at = 5,   icon = "🔗", title = "Stick Figure" },
  { at = 15,  icon = "🧱", title = "Lab Rat" },
  { at = 40,  icon = "🥽", title = "Goggles On" },
  { at = 100, icon = "🧬", title = "Molecule Whisperer" },
  { at = 250, icon = "👑", title = "Avogadro's Favorite" },
]

