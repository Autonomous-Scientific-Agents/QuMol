<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>QuMol</title>
<style>
:root{--bg:#0b1020;--panel:rgba(20,28,52,.88);--btn:#24304f;--acc:#7c5cff;--acc2:#20d3a7;--txt:#eef2ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;display:flex;gap:6px;padding:8px;pointer-events:none}
.bar *{pointer-events:auto}
#top{top:0;justify-content:space-between;align-items:center;padding-top:max(8px,env(safe-area-inset-top))}
#bottom{bottom:0;flex-direction:column;align-items:center;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
button{border:0;border-radius:12px;min-width:44px;height:44px;padding:0 12px;font-size:16px;font-weight:700;color:var(--txt);background:var(--btn);cursor:pointer;transition:transform .08s,box-shadow .2s}
button:active{transform:scale(.9)}
button.on{background:var(--acc);box-shadow:0 0 14px var(--acc)}
.el{width:44px;padding:0;border:3px solid transparent}
.el.on{border-color:#fff;box-shadow:0 0 14px currentColor}
.ico{display:inline-flex;align-items:center;gap:6px}
.ico svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* hover tooltips (mouse/trackpad only; phones get the text labels) */
[data-tip]{position:relative}
@media (hover:hover){
  [data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
    width:max-content;max-width:260px;white-space:normal;text-align:left;background:#0e1530;color:var(--txt);border:1px solid #2c3a66;
    border-radius:10px;padding:8px 10px;font-size:13px;font-weight:500;line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.45);
    z-index:20;pointer-events:none;animation:tipIn .15s .35s both}
  .tip-below[data-tip]:hover::after{bottom:auto;top:calc(100% + 10px)}
  .tip-right[data-tip]:hover::after{left:auto;right:0;transform:none}
}
@keyframes tipIn{from{opacity:0}}
#xyzBtn{font-size:13px;letter-spacing:.5px}
#xyzBtn.on,#learn.on{background:var(--acc)}
.warnbox{background:rgba(255,170,60,.12);border:1px solid #b9792a;color:#ffd9a8;border-radius:10px;padding:8px 10px;margin:4px 0 10px;font-size:14px;line-height:1.4;text-align:left}
/* formula / XYZ panel */
#xyzPanel{position:fixed;top:64px;right:8px;width:320px;max-height:calc(100vh - 260px);display:flex;flex-direction:column;gap:6px;
  background:var(--panel);border:1px solid #2c3a66;border-radius:16px;padding:10px;z-index:5;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.phead button{min-width:34px;height:34px;padding:0;font-size:15px}
.pformula{font-size:24px;font-weight:800;line-height:1.1}
.pformula sub{font-size:.6em}
.psmiles{font-family:ui-monospace,Menlo,monospace;font-size:12px;opacity:.7;word-break:break-all}
#xyzText{flex:1;min-height:140px;resize:none;background:#0e1530;color:var(--txt);border:1px solid #2c3a66;border-radius:10px;padding:8px;
  font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.45;white-space:pre;overflow:auto;
  user-select:text;-webkit-user-select:text;touch-action:auto}
#xyzText:focus{outline:2px solid var(--acc);outline-offset:-1px}
#xyzText.bad{border-color:#ff6b6b}
.pmsg{font-size:12px;opacity:.75;line-height:1.35}
.pmsg.err{opacity:1;color:#ff8a8a}
.pmsg.ok{opacity:1;color:var(--acc2)}
.pill b sub{font-size:.7em}
@media (max-width:640px){
  .brand{display:none}
  #top .right button{min-width:38px;padding:0 8px}
  #xyzPanel{left:8px;right:8px;width:auto;max-height:34vh}
  #xyzText{min-height:90px}
}
/* learn panel */
.card.wide{width:min(94vw,520px)}
.lgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.lgrid button{height:52px;font-size:20px;padding:0;border:3px solid transparent}
.lgrid button.on{border-color:#fff}
.ecard{background:#0e1530;border-radius:14px;padding:12px;animation:slide .25s both}
.ecard h3{margin:0 0 4px;font-size:20px}
.ecard .row2{display:flex;gap:12px;align-items:center}
.ecard svg.lewis{width:92px;height:92px;flex:none}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14px}
.facts b{color:#9fb0ff;font-weight:600}
.slots{display:flex;gap:4px;margin:6px 0}
.slots span{width:22px;height:8px;border-radius:4px;background:var(--acc2)}
.slots span.lp{background:#ffd166}
.legend{font-size:12px;opacity:.75}
.try{margin-top:10px;width:100%;background:linear-gradient(135deg,#ff5ca8,#7c5cff)}
.shape{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #22305a}
.shape .ang{font-size:22px;font-weight:900;color:#ffd166;min-width:72px;text-align:center}
.shape p{margin:0;font-size:14px}
.shape button{flex:none;height:38px;font-size:13px}
.quizq{font-size:18px;font-weight:700;margin:6px 0 10px}
.quizopts{display:grid;gap:8px}
.quizopts button{text-align:left;height:auto;min-height:44px;padding:10px 12px;font-weight:600}
.quizopts button.right{background:#1f7a5c}
.quizopts button.wrong{background:#7a2a3a}
.qexp{margin-top:10px;font-size:14px;line-height:1.45;animation:slide .25s both}
.streak{text-align:center;font-size:14px;opacity:.85;margin-bottom:4px}
#submit{background:linear-gradient(135deg,var(--acc),var(--acc2));padding:0 22px;font-size:17px}
#submit svg{width:22px;height:22px}
#els #hplus{margin-right:14px}
@media (max-width:380px){
  #bottom .row{gap:4px}
  #bottom .row button{font-size:14px;padding:0 9px;height:42px}
  #bottom .ico svg{width:17px;height:17px}
  #els button{width:38px;min-width:38px;padding:0}
  #els #hplus{margin-right:8px}
  #top .right{gap:4px}
  #top .right button{min-width:34px;height:38px;padding:0 6px;font-size:14px}
  .pill{max-width:28vw;padding:8px}
}
.left{display:flex;gap:8px;align-items:center;min-width:0}
.brand{font-weight:900;font-size:20px;background:linear-gradient(90deg,#7c5cff,#20d3a7);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{background:var(--panel);border-radius:12px;padding:8px 12px;font-size:13px;min-width:0;max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{display:flex;gap:6px;align-items:center}
#total{background:var(--panel);font-size:17px;white-space:nowrap}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--panel);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
body.busy #bottom button{opacity:.45;pointer-events:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,20,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:10}
.hidden{display:none!important}
.card{background:#141c34;border:1px solid #2c3a66;border-radius:20px;padding:20px;width:min(92vw,440px);max-height:82vh;overflow:auto;animation:pop .4s cubic-bezier(.2,1.6,.4,1);touch-action:pan-y}
.card h2{margin:0 0 10px;text-align:center}
.card p{line-height:1.45;margin:6px 0}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid #22305a;animation:slide .3s both}
.line small{display:block;opacity:.6;font-size:12px;word-break:break-all}
.line small a{color:#9fb0ff;text-decoration:underline;opacity:1}
.pts{font-weight:800;color:var(--acc2);white-space:nowrap}
.pts.zero{color:#8090b8}
.mult .pts{color:#ffd166}
#ovTotal{font-size:46px;font-weight:900;text-align:center;margin:14px 0;background:linear-gradient(90deg,#ffd166,#ff5ca8,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.wow{font-size:24px;font-weight:900;text-align:center;color:#ffd166;animation:pulse .6s infinite alternate}
#ovBtn{width:100%;margin-top:6px;background:linear-gradient(135deg,var(--acc),var(--acc2))}
input{width:100%;height:46px;border-radius:12px;border:1px solid #2c3a66;background:#0e1530;color:var(--txt);font-size:17px;padding:0 12px;margin:6px 0;user-select:text;-webkit-user-select:text}
.link{background:none;color:#9fb0ff;text-decoration:underline;width:100%;font-weight:500;font-size:14px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;text-align:center;letter-spacing:1px;background:#0e1530;border-radius:12px;padding:12px;margin:10px 0;user-select:text;-webkit-user-select:text}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.tabs button{flex:0 0 auto;height:36px;font-size:13px}
.line.me{background:rgba(124,92,255,.18);border-radius:8px;padding-left:6px;padding-right:6px}
.err{color:#ff8a8a;min-height:20px;font-size:14px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes slide{from{transform:translateX(-24px);opacity:0}}
@keyframes pulse{to{transform:scale(1.08)}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="bar">
  <div class="left"><span class="brand">QuMol</span><span id="info" class="pill">Loading…</span></div>
  <div class="right">
    <button id="learn" class="tip-below" data-tip="Learn chemistry: how each element bonds, molecular shapes, and a quiz" aria-label="Learn chemistry">🎓</button>
    <button id="xyzBtn" class="tip-below" data-tip="Formula and XYZ coordinates panel. Edit the coordinates to change the molecule directly" aria-label="Formula and XYZ panel">XYZ</button>
    <button id="mute" class="tip-below" data-tip="Sound on/off" aria-label="Sound on/off">🔊</button>
    <button id="help" class="tip-below" data-tip="How to play" aria-label="How to play">?</button>
    <button id="lb" class="tip-below" data-tip="Leaderboards" aria-label="Leaderboards">🏆</button>
    <button id="total" class="tip-below tip-right" data-tip="Your score and molecule collection" aria-label="Your score and molecule collection">0 ⭐</button>
  </div>
</div>

<div id="bottom" class="bar">
  <div class="row" id="els"></div>
  <div class="row">
    <button class="mode on ico" data-mode="add" data-tip="Add: click an element button to drop an atom next to the molecule, or tap an atom to grow the selected element from it. Tap a bond to change single → double → triple">➕ Add</button>
    <button class="mode ico" data-mode="bond" data-tip="Bond: tap two atoms to connect them (great for closing rings); tapping the same pair again cycles single → double → triple → no bond. Tap a bond directly to change its order">🔗 Bond</button>
    <button class="mode ico" data-mode="move" data-tip="Move: drag an atom to fine-tune the geometry. The closer to the optimum, the more points">✋ Move</button>
    <button class="mode ico" data-mode="delete" data-tip="Delete: tap an atom to remove it (with its hydrogens), or tap a bond to break it">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M9 6V4h6v2"/><path d="M5 6l1.2 14h11.6L19 6"/><path d="M10 11l4 5M14 11l-4 5"/></svg>Delete</button>
  </div>
  <div class="row">
    <button id="hplus" data-tip="Saturate with hydrogens: every atom with free bonds gets H atoms until it has its full valence (C 4, N 3, O 2, S 2). Build does this automatically">H+</button>
    <button id="undo" class="ico" data-tip="Undo: step back one change">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button>
    <button id="clear" class="ico" data-tip="Clear all: remove the whole molecule and start over (Undo brings it back)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 21l-4.3-4.3a2.4 2.4 0 0 1 0-3.4l9.6-9.6a2.4 2.4 0 0 1 3.4 0l5.6 5.6a2.4 2.4 0 0 1 0 3.4L13 21"/><path d="M22 21H7"/><path d="M5 11l9 9"/></svg>Clear</button>
    <button id="submit" class="ico tip-right" data-tip="Build: your molecule is optimized, checked for stability and scored" aria-label="Build">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v6.2L4.6 18.6A1.6 1.6 0 0 0 6 21h12a1.6 1.6 0 0 0 1.4-2.4L14 9.2V3"/><path d="M7.2 15h9.6"/><circle cx="10.5" cy="18" r="0.6" fill="currentColor"/><circle cx="13.6" cy="17.2" r="0.5" fill="currentColor"/></svg>Build</button>
  </div>
</div>

<aside id="xyzPanel" class="hidden" aria-label="Formula and coordinates">
  <div class="phead">
    <div><div id="pFormula" class="pformula">—</div><div id="pSmiles" class="psmiles"></div></div>
    <button id="xyzClose" class="tip-below tip-right" data-tip="Hide panel" aria-label="Hide panel">✕</button>
  </div>
  <textarea id="xyzText" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="XYZ coordinates"></textarea>
  <div id="xyzMsg" class="pmsg">Edit coordinates (Å) to change the molecule. Add or remove lines to add or remove atoms.</div>
</aside>

<div id="toast"></div>
<div id="ov" class="hidden"><div class="card" id="card"></div></div>

<script type="module" src="app.js"></script>
</body>
</html>
