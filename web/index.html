<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>QuMol</title>
<style>
:root{--bg:#0b1020;--panel:rgba(20,28,52,.88);--btn:#24304f;--acc:#7c5cff;--acc2:#20d3a7;--txt:#eef2ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;display:flex;gap:6px;padding:8px;pointer-events:none}
.bar *{pointer-events:auto}
#top{top:0;justify-content:space-between;align-items:center;padding-top:max(8px,env(safe-area-inset-top))}
#bottom{bottom:0;flex-direction:column;align-items:center;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
button{border:0;border-radius:12px;min-width:44px;height:44px;padding:0 12px;font-size:16px;font-weight:700;color:var(--txt);background:var(--btn);cursor:pointer;transition:transform .08s,box-shadow .2s}
button:active{transform:scale(.9)}
button.on{background:var(--acc);box-shadow:0 0 14px var(--acc)}
.el{width:44px;padding:0;border:3px solid transparent}
.el.on{border-color:#fff;box-shadow:0 0 14px currentColor}
.ico{display:inline-flex;align-items:center;gap:6px}
.ico svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* hover tooltips (mouse/trackpad only; phones get the text labels) */
[data-tip]{position:relative}
@media (hover:hover){
  [data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
    width:max-content;max-width:260px;white-space:normal;text-align:left;background:#0e1530;color:var(--txt);border:1px solid #2c3a66;
    border-radius:10px;padding:8px 10px;font-size:13px;font-weight:500;line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.45);
    z-index:20;pointer-events:none;animation:tipIn .15s .35s both}
  .tip-below[data-tip]:hover::after{bottom:auto;top:calc(100% + 10px)}
  .tip-right[data-tip]:hover::after{left:auto;right:0;transform:none}
}
@keyframes tipIn{from{opacity:0}}
#xyzBtn{font-size:13px;letter-spacing:.5px}
#xyzBtn.on,#measure.on,#plotBtn.on{background:var(--acc)}
/* measurement labels (bond lengths, angles) drawn over the 3D view */
#measures{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.ml{position:absolute;transform:translate(-50%,-50%);font:600 11.5px/1 ui-monospace,Menlo,monospace;color:#eef2ff;
  background:rgba(11,16,32,.72);border:1px solid #2c3a66;border-radius:6px;padding:2px 4px;white-space:nowrap}
.ml.ang{color:#20d3a7;border-color:#1c6b5a}
#optInfo{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:4;max-width:calc(100vw - 24px);
  background:rgba(11,16,32,.8);border:1px solid #2c3a66;border-radius:10px;padding:6px 10px;
  font:600 12px/1.3 ui-monospace,Menlo,monospace;color:#eef2ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#optInfo.hidden{display:none}
.optlog{margin:8px 0 12px;font-size:13px;text-align:left}
.optlog summary{cursor:pointer;opacity:.8;padding:4px 0}
.optlog ul{margin:6px 0;padding-left:18px;line-height:1.45;opacity:.9}
.optlog li.bad{color:#ff9a9a}
.optlog pre{max-height:180px;overflow:auto;background:#0e1530;border:1px solid #2c3a66;border-radius:8px;padding:8px;
  font-size:11px;line-height:1.35;margin:6px 0 0;user-select:text;-webkit-user-select:text;touch-action:auto}
#puzzleBar{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:4;background:var(--panel);
  border:1px solid var(--acc);border-radius:14px;padding:6px 8px 6px 12px;box-shadow:0 0 18px rgba(124,92,255,.35);
  max-width:calc(100vw - 16px);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#puzzleBar.hidden{display:none}
body.puzzling #toast{top:128px}
.pzrow{display:flex;align-items:center;gap:10px;white-space:nowrap}
#pzTitle{font-weight:800;overflow:hidden;text-overflow:ellipsis}
#pzTitle sub{font-size:.65em}
#pzTimer{font-family:ui-monospace,Menlo,monospace;opacity:.85}
#puzzleBar button{min-width:34px;height:34px;padding:0 8px;font-size:15px}
#pzSub{font-size:15px;opacity:.9;font-family:ui-monospace,Menlo,monospace;word-break:break-all}
#pzSub:empty{display:none}
button.disabled{opacity:.35}
.pzlist .line{cursor:pointer}
.line small .smi,.coll .line small{font-family:ui-monospace,Menlo,monospace;font-size:14px;opacity:1}
.pzlist .line:hover{background:rgba(124,92,255,.12)}
.diffs{font-size:13px;margin:8px 0;opacity:.9}
.diffs div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.src{font-size:11px;opacity:.55;margin:8px 0;line-height:1.35}
.card input+small{display:block;font-size:12px;opacity:.6;margin:-4px 0 8px}
.warnbox{background:rgba(255,170,60,.12);border:1px solid #b9792a;color:#ffd9a8;border-radius:10px;padding:8px 10px;margin:4px 0 10px;font-size:14px;line-height:1.4;text-align:left}
/* formula / XYZ panel */
#xyzPanel{position:fixed;top:64px;right:8px;width:320px;max-height:calc(100vh - 260px);display:flex;flex-direction:column;gap:6px;
  background:var(--panel);border:1px solid #2c3a66;border-radius:16px;padding:10px;z-index:5;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.phead button{min-width:34px;height:34px;padding:0;font-size:15px}
.pformula{font-size:24px;font-weight:800;line-height:1.1}
.pformula sub{font-size:.6em}
.psmiles{font-family:ui-monospace,Menlo,monospace;font-size:15px;opacity:.85;margin-top:2px;word-break:break-all}
#xyzText{flex:1;min-height:140px;resize:none;background:#0e1530;color:var(--txt);border:1px solid #2c3a66;border-radius:10px;padding:8px;
  font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.45;white-space:pre;overflow:auto;
  user-select:text;-webkit-user-select:text;touch-action:auto}
#xyzText:focus{outline:2px solid var(--acc);outline-offset:-1px}
#xyzText.bad{border-color:#ff6b6b}
.pmsg{font-size:12px;opacity:.75;line-height:1.35}
.pmsg.err{opacity:1;color:#ff8a8a}
.pmsg.ok{opacity:1;color:var(--acc2)}
.pill b sub{font-size:.7em}
@media (max-width:640px){
  #puzzleBar{top:56px}
  .brand{display:none}
  #top .right button{min-width:38px;padding:0 8px}
  #xyzPanel{left:8px;right:8px;width:auto;max-height:34vh}
  #xyzText{min-height:90px}
}
/* optimization plots panel */
#plotPanel{position:fixed;top:64px;left:8px;width:340px;max-height:calc(100vh - 260px);overflow:auto;display:flex;flex-direction:column;gap:6px;
  background:var(--panel);border:1px solid #2c3a66;border-radius:16px;padding:10px;z-index:5;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:pan-y}
@media (max-width:640px){#plotPanel{left:8px;right:8px;width:auto;max-height:42vh}}  /* after the base rule */
#plotPanel h3{margin:0;font-size:16px}
#plotMeta{font-size:12px;opacity:.75;line-height:1.35}
.ctitle{font-size:12px;opacity:.85;margin-top:2px}
.chart{width:100%;height:auto;display:block;background:#0e1530;border:1px solid #2c3a66;border-radius:10px}
.chart .grid{stroke:#22305a;stroke-width:1}
.chart text{fill:#8090b8;font:10px ui-monospace,Menlo,monospace}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round}
.chart .e{stroke:var(--acc2)}
.chart .f{stroke:#ffd166}
.chart .stage{stroke:#7c5cff;stroke-dasharray:3 3}
.chart .dot{stroke:none}
.chart .e.dot{fill:var(--acc2)}
.chart .f.dot{fill:#ffd166}
/* learn panel */
.card.wide{width:min(94vw,520px)}
.lgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.lgrid button{height:52px;font-size:20px;padding:0;border:3px solid transparent}
.lgrid button.on{border-color:#fff}
.ecard{background:#0e1530;border-radius:14px;padding:12px;animation:slide .25s both}
.ecard h3{margin:0 0 4px;font-size:20px}
.ecard .row2{display:flex;gap:12px;align-items:center}
.ecard svg.lewis{width:92px;height:92px;flex:none}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14px}
.facts b{color:#9fb0ff;font-weight:600}
.slots{display:flex;gap:4px;margin:6px 0}
.slots span{width:22px;height:8px;border-radius:4px;background:var(--acc2)}
.slots span.lp{background:#ffd166}
.legend{font-size:12px;opacity:.75}
.try{margin-top:10px;width:100%;background:linear-gradient(135deg,#ff5ca8,#7c5cff)}
.try.lessonBtn{background:linear-gradient(135deg,#20d3a7,#3d6bff)}
.shape{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #22305a}
.shape .ang{font-size:22px;font-weight:900;color:#ffd166;min-width:72px;text-align:center}
.shape p{margin:0;font-size:14px}
.shape button{flex:none;height:38px;font-size:13px}
.quizq{font-size:18px;font-weight:700;margin:6px 0 10px}
.quizopts{display:grid;gap:8px}
.quizopts button{text-align:left;height:auto;min-height:44px;padding:10px 12px;font-weight:600}
.quizopts button.right{background:#1f7a5c}
.quizopts button.wrong{background:#7a2a3a}
.qexp{margin-top:10px;font-size:14px;line-height:1.45;animation:slide .25s both}
.streak{text-align:center;font-size:14px;opacity:.85;margin-bottom:4px}
#submit{background:linear-gradient(135deg,var(--acc),var(--acc2));padding:0 22px;font-size:17px}
#submit svg{width:22px;height:22px}
#els #hplus{margin-right:14px}
@media (max-width:380px){
  #bottom .row{gap:4px}
  #bottom .row button{font-size:14px;padding:0 9px;height:42px}
  #bottom .ico svg{width:17px;height:17px}
  #els button{width:38px;min-width:38px;padding:0}
  #els #hplus{margin-right:8px}
  #top .right{gap:4px}
  #top .right button{min-width:34px;height:38px;padding:0 6px;font-size:14px}
  .pill{max-width:28vw;padding:8px}
}
.left{display:flex;gap:8px;align-items:center;min-width:0}
.brand{font-weight:900;font-size:20px;background:linear-gradient(90deg,#7c5cff,#20d3a7);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{background:var(--panel);border-radius:12px;padding:8px 12px;font-size:13px;min-width:0;max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{display:flex;gap:6px;align-items:center}
#total{background:var(--panel);font-size:17px;white-space:nowrap}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--panel);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
body.busy #bottom button{opacity:.45;pointer-events:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,20,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:10}
.hidden{display:none!important}
.card{background:#141c34;border:1px solid #2c3a66;border-radius:20px;padding:20px;width:min(92vw,440px);max-height:82vh;overflow:auto;animation:pop .4s cubic-bezier(.2,1.6,.4,1);touch-action:pan-y}
.card h2{margin:0 0 10px;text-align:center}
.card h2.mname{margin-bottom:2px}
.mformula{text-align:center;font-size:22px;font-weight:800}
.mformula sub{font-size:.6em}
.msmiles{text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:17px;opacity:.85;word-break:break-all;margin-top:2px}
.mpubchem{text-align:center;font-size:14px;margin:6px 0 10px;opacity:.85}
.mpubchem a{color:#9fb0ff}
.card p{line-height:1.45;margin:6px 0}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid #22305a;animation:slide .3s both}
.line small{display:block;opacity:.6;font-size:12px;word-break:break-all}
.line small a{color:#9fb0ff;text-decoration:underline;opacity:1}
.pts{font-weight:800;color:var(--acc2);white-space:nowrap}
.pts.zero{color:#8090b8}
.mult .pts{color:#ffd166}
#ovTotal{font-size:46px;font-weight:900;text-align:center;margin:14px 0;background:linear-gradient(90deg,#ffd166,#ff5ca8,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.wow{font-size:24px;font-weight:900;text-align:center;color:#ffd166;animation:pulse .6s infinite alternate}
#ovBtn{width:100%;margin-top:6px;background:linear-gradient(135deg,var(--acc),var(--acc2))}
input{width:100%;height:46px;border-radius:12px;border:1px solid #2c3a66;background:#0e1530;color:var(--txt);font-size:17px;padding:0 12px;margin:6px 0;user-select:text;-webkit-user-select:text}
.link{background:none;color:#9fb0ff;text-decoration:underline;width:100%;font-weight:500;font-size:14px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;text-align:center;letter-spacing:1px;background:#0e1530;border-radius:12px;padding:12px;margin:10px 0;user-select:text;-webkit-user-select:text}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.tabs button{flex:0 0 auto;height:36px;font-size:13px}
.line.me{background:rgba(124,92,255,.18);border-radius:8px;padding-left:6px;padding-right:6px}
.err{color:#ff8a8a;min-height:20px;font-size:14px}
/* the alchemy lab behind the cauldron */
#lab{position:fixed;inset:0;display:none}
#lab svg{width:100%;height:100%;display:block}
body.cooking #lab{display:block}
#lab .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .13s infinite alternate}
#lab .glow{animation:glowp 2.6s ease-in-out infinite alternate}
#lab .twk{animation:twk 3s ease-in-out infinite alternate}
#lab .bub{transform-box:fill-box;animation:bub 2.8s ease-in infinite}
#lab .mote{animation:mote 10s linear infinite}
#lab .sway{animation:sway 5s ease-in-out infinite alternate}
#lab .runes{animation:glowp 3.5s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) skewX(0)}to{transform:scale(.88,1.12) skewX(4deg)}}
@keyframes glowp{from{opacity:.65}to{opacity:1}}
@keyframes twk{from{opacity:.25}to{opacity:1}}
@keyframes bub{from{transform:translateY(0);opacity:.7}to{transform:translateY(-40px);opacity:0}}
@keyframes mote{0%{transform:translate(0,0);opacity:0}20%{opacity:.6}100%{transform:translate(40px,-160px);opacity:0}}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
/* tray phases */
#kitchen:not([data-phase=prep]) .kprep,#kitchen:not([data-phase=prep]) .ktimer{display:none}
#kitchen[data-phase=prep] #kdone{display:none}
.ktimer{display:none;align-items:center;gap:10px}
body.simmer .ktimer{display:flex}
.ktimer .hg{font-size:20px;animation:hg 1.2s ease-in-out infinite}
.kbar{flex:1;height:12px;border-radius:6px;background:#3a2a1e;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.kbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3dff8f,#ffd166,#ff7a1a);transition:width .15s linear}
.ktimer b{min-width:110px;text-align:right;font-variant-numeric:tabular-nums}
@keyframes hg{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
#kdone{display:flex;flex-direction:column;gap:8px}
.kmsg{text-align:center;line-height:1.4}
.kmsg .khint{opacity:.65;font-size:12px}
.kgo{background:linear-gradient(180deg,#ffd166,#ff7a1a)!important;color:#1b0f05;flex:1;max-width:260px;box-shadow:0 0 18px rgba(255,122,26,.5)}
.kmols{display:flex;flex-direction:column;gap:4px;max-height:30vh;overflow:auto}
.kmol{display:flex;align-items:center;gap:8px;background:#2e2219;border-radius:10px;padding:6px 10px;cursor:pointer}
.kmol input{width:20px;height:20px;accent-color:#ff9a2e;flex:none}
.kmol small{flex:1;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kmol .link{height:auto;min-width:0;padding:2px 4px;font-size:13px;background:none}
.kmol .link.ico{flex:none;width:auto;margin-left:auto;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;background:#3d2c20;color:#ffd9a8;text-decoration:none}
.kmol .link.ico svg{width:16px;height:16px}
.kres{font-weight:800;min-width:48px;text-align:right}
.kres.ok{color:#ffd166}.kres.zero{opacity:.6}.kres.busy{animation:twk .5s infinite alternate}
#shaker{position:fixed;z-index:4;font-size:64px;transform:translate(-30%,-95%) rotate(160deg);pointer-events:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
#shaker.hidden{display:none}
#shaker.go{animation:saltbae 1.6s ease-in-out forwards}
@keyframes saltbae{0%{transform:translate(10%,-160%) rotate(120deg);opacity:0}15%{transform:translate(-30%,-95%) rotate(160deg);opacity:1}
  25%{transform:translate(-30%,-90%) rotate(175deg)}35%{transform:translate(-30%,-95%) rotate(150deg)}45%{transform:translate(-30%,-90%) rotate(175deg)}
  55%{transform:translate(-30%,-95%) rotate(150deg)}65%{transform:translate(-30%,-90%) rotate(175deg)}85%{transform:translate(-30%,-95%) rotate(160deg);opacity:1}100%{transform:translate(20%,-150%) rotate(120deg);opacity:0}}
/* cooking mode: the kitchen tray replaces the build bar */
#cookBtn svg.pot,.pot{width:26px;height:26px;flex:none;display:block}
#cookBtn{padding:0 6px}
#cookBtn:hover svg.pot{animation:wobble .5s ease-in-out}
body.cooking #cookBtn{background:#1f7a5c;box-shadow:0 0 14px #3dff8f}
body.cooking #bottom{display:none}
body.cooking #top .right button:not(#total):not(#cookBtn):not(#mute){opacity:.45;pointer-events:none}
body.simmer #cookBtn{opacity:.45;pointer-events:none}
#kitchen{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:3;width:min(560px,calc(100vw - 16px));
  margin-bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;padding:10px 12px;
  background:linear-gradient(180deg,rgba(40,26,18,.92),rgba(22,16,12,.94));border:1px solid #6b4a2a;border-radius:18px;
  box-shadow:0 0 24px rgba(255,122,26,.18),inset 0 1px 0 rgba(255,220,180,.08)}
#kitchen.hidden{display:none}
.kjars{display:flex;gap:10px;justify-content:center}
.kjar{position:relative;flex:1;max-width:120px;height:auto;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:#2e2219;border:2px solid #6b4a2a;border-radius:16px}
.kjar:hover:not(:disabled){border-color:var(--ec);box-shadow:0 0 14px var(--ec)}
.kjar:active:not(:disabled) .kball{transform:translateY(4px) scale(.9)}
.kjar:disabled{opacity:.4;cursor:default}
.kball{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:900;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.7);background:radial-gradient(circle at 35% 30%,#fff8 0,var(--ec) 35%,#000a 120%);
  box-shadow:0 3px 8px rgba(0,0,0,.5);transition:transform .08s}
.kname{font-size:12px;opacity:.8;font-weight:600}
.kcnt{position:absolute;top:4px;right:8px;font-size:13px;font-weight:800;color:#ffd166}
.kfire{display:flex;align-items:center;gap:10px}
.kfire label{font-weight:800;white-space:nowrap;min-width:138px}
.kfire input{flex:1;height:auto;padding:0;border:0;background:none;accent-color:#ff7a1a}
.kfire b{min-width:130px;text-align:right;font-size:14px;white-space:nowrap}
.kacts{display:flex;gap:8px;justify-content:center;align-items:center}
.kacts button{background:#3a2a1e}
.kacts button:disabled{opacity:.4;cursor:default}
#kCook{flex:1;max-width:220px;height:52px;font-size:20px;gap:8px;justify-content:center;color:#1b0f05;
  background:linear-gradient(180deg,#ffd166,#ff7a1a);box-shadow:0 0 18px rgba(255,122,26,.55)}
#kCook:not(:disabled){animation:pulse 1.2s ease-in-out infinite alternate}
#kCook .pot{width:30px;height:30px}
body.simmer #kCook{animation:none}
.potttl{display:flex;justify-content:center;gap:8px}
.potttl .pot{width:34px;height:34px}
.line.cookprod{cursor:pointer}
.line.cookprod:hover{background:rgba(32,211,167,.12);border-radius:8px}
@keyframes wobble{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@media (max-width:420px){.kfire b{min-width:92px;font-size:12px}.kfire label{min-width:126px;font-size:14px}.kball{width:38px;height:38px}.kacts{gap:6px}.kacts button{padding:0 10px}.kt{display:none}#kCook{min-width:130px}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes slide{from{transform:translateX(-24px);opacity:0}}
@keyframes pulse{to{transform:scale(1.08)}}
/* badges */
#badgePop{position:fixed;left:50%;top:84px;transform:translate(-50%,-30px) scale(.8);z-index:30;display:flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,#2b2160,#143a4a);border:2px solid #ffd166;border-radius:18px;padding:10px 18px 10px 12px;
  box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 24px rgba(255,209,102,.35);opacity:0;pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.2,1.6,.4,1);cursor:pointer;width:max-content;max-width:92vw;box-sizing:border-box}
#badgePop.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#badgePop .bpi{font-size:40px;line-height:1;animation:bpspin .9s ease-out}
#badgePop small{display:block;white-space:nowrap;font-size:12px;color:#ffd166;text-transform:uppercase;letter-spacing:.06em}
#badgePop b{font-size:18px;display:block}
#badgePop em{display:block;font-style:normal;font-size:12px;opacity:.7}
@keyframes bpspin{from{transform:rotate(-200deg) scale(.2)}to{transform:none}}
.card.badges{width:min(94vw,520px)}
.bladder{background:#151d3a;border:1px solid #2c3a66;border-radius:14px;padding:10px 12px;margin:8px 0}
.bl-h{display:flex;justify-content:space-between;gap:8px;font-size:15px}.bl-h span{opacity:.75;font-size:13px}
.bl-tiers{display:flex;gap:6px;margin:8px 0 6px;flex-wrap:wrap}
.btier{display:flex;flex-direction:column;align-items:center;font-size:24px;line-height:1.1;filter:grayscale(1);opacity:.35;min-width:36px}
.btier small{font-size:10px;opacity:.9}.btier.on{filter:none;opacity:1}
.bl-bar{height:6px;background:#0d1330;border-radius:3px;overflow:hidden}.bl-bar i{display:block;height:100%;background:linear-gradient(90deg,#20d3a7,#7c5cff)}
.bl-next{font-size:13px;margin-top:6px;opacity:.85}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:12px 0}
.bbadge{background:#151d3a;border:1px solid #2c3a66;border-radius:12px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.bbadge span{font-size:30px;filter:grayscale(1);opacity:.3}.bbadge b{font-size:14px;opacity:.5}.bbadge small{font-size:12px;opacity:.65}
.bbadge.on{border-color:#ffd166}.bbadge.on span{filter:none;opacity:1}.bbadge.on b{opacity:1}
@media (prefers-reduced-motion:reduce){#badgePop .bpi{animation:none}}
/* beginner lesson (lesson.js) */
#lesson{position:fixed;inset:0;z-index:14;display:grid;grid-template-rows:auto minmax(200px,1fr) auto;background:radial-gradient(ellipse at 50% 30%,#1b2550,#0b1020 70%);touch-action:none}
#lesson.hidden{display:none}
body.lessoning #top,body.lessoning #bottom{visibility:hidden}
.lhead{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
.lhead b{font-size:16px;white-space:nowrap}
.ldots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.ldot{min-width:0;width:12px;height:12px;padding:0;border-radius:50%;background:#2c3a66}
.ldot.seen{background:#4b5b96}.ldot.on{background:var(--acc2);box-shadow:0 0 10px var(--acc2)}
.ldot:disabled{cursor:default;opacity:.6}
.lx{min-width:40px;height:40px}
.lstage{width:100%;height:100%;display:block;overflow:visible}
.lpanel{width:min(100%,640px);justify-self:center;background:#141c34;border:1px solid #2c3a66;border-bottom:0;border-radius:18px 18px 0 0;padding:14px 18px;padding-bottom:max(14px,env(safe-area-inset-bottom));max-height:48vh;overflow:auto;touch-action:pan-y}
.lpanel h3{margin:0 0 6px;font-size:18px;color:#ffd166}
.ltext{font-size:15.5px;line-height:1.5}
.ltext p{margin:8px 0}
.ltask{margin-top:10px;padding:8px 12px;border-radius:10px;background:#1d2a50;font-size:15px;font-weight:600;transition:background .2s}
.ltask.bad{background:#4a2433;animation:lshake .35s}
.ltask.ok{background:#16483d}
.lprog{float:right;opacity:.75;font-weight:500}
.lafter{max-height:0;overflow:hidden;opacity:0;transition:max-height .6s,opacity .6s,margin .6s;font-size:15.5px;line-height:1.5;border-left:3px solid var(--acc2);padding-left:12px}
.lafter.show{max-height:400px;opacity:1;margin-top:10px}
.lnav{display:flex;gap:8px;margin-top:12px}
.lnav .lnext{margin-left:auto;min-width:110px}
.lnav .lnext.go{background:linear-gradient(135deg,var(--acc2),var(--acc));animation:lpulse 1.6s infinite}
.lnav button:disabled{opacity:.4;cursor:default}
.lend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lend:empty{display:none}
.lend button{flex:1}
.lend .lgo{background:linear-gradient(135deg,#ff5ca8,#7c5cff)}
.ltab{border-collapse:collapse;margin:4px 0;font-size:15px}
.ltab th,.ltab td{padding:3px 12px;text-align:center}.ltab th{font-weight:600;opacity:.75;font-size:13px}
.ltab td:first-child{font-weight:800}
.lquiz{display:flex;gap:8px}.lquiz button{flex:1;max-width:80px}
.lquiz button.right{background:#1f7a5c}.lquiz button.wrong{background:#7a2a3a}
.lstage text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;pointer-events:none}
.lsym{font-size:17px;font-weight:800;text-anchor:middle}
.lname{font-size:12px;fill:#c9d3ff;text-anchor:middle}
.lhint{font-size:11px;fill:#8d98c4;text-anchor:middle}
.lkey{font-size:12px;fill:#c9d3ff}
.lballsym{font-weight:800;text-anchor:middle;pointer-events:none}
.lcount{font-size:14px;font-weight:700;fill:#ffd166;text-anchor:middle;animation:lfade .4s}
.llabel{font-size:12px;font-weight:600;fill:#fff;animation:lfade .4s}
.lleader{stroke:#ffffffaa;stroke-width:1;stroke-dasharray:3 2}
.lnote{font-size:12px;font-weight:800;text-anchor:middle;fill:#ffd166;animation:lrise 1.8s forwards}
.lnote.ok{fill:#20d3a7}.lnote.end{text-anchor:end}
.la.drag{cursor:grab}.la.held{cursor:grabbing}
.la.drag>circle:nth-child(4){filter:drop-shadow(0 0 5px #ffffff66)}
.la.held{filter:drop-shadow(0 6px 8px #000a)}
.lgauge-bg{fill:none;stroke:#ffffff18;stroke-width:3}
.lgauge{fill:none;stroke:#ffd166;stroke-width:3;stroke-linecap:round;transition:stroke-dasharray .5s,stroke .3s}
.lgauge.full{stroke:#20d3a7}
.lel{stroke:#0b1020;stroke-width:1;fill:#ffd166;pointer-events:none}
.lseat{fill:none;stroke:#ffffff99;stroke-width:1.2;stroke-dasharray:2 2}
.llp{fill:#ffd16622;stroke:#ffd16688;stroke-width:1}
.llp-t{font-size:10px;fill:#ffd166cc}
.lbond-hit{stroke:transparent;stroke-width:24;cursor:pointer}
.lbond-line{stroke:#dfe6ff;stroke-width:3;stroke-linecap:round;transition:opacity .3s}
.lspark{fill:none;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:lspark .8s ease-out both}
.lstick{stroke:#c9d0e0;stroke-width:4;stroke-linecap:round}
.lmol{animation:lbob 3.3s ease-in-out infinite;cursor:pointer;transform-box:fill-box;transform-origin:center}
.lmol.wig{animation:lwig .6s}
.shell .orbit{fill:none;stroke:#ffffff35;stroke-width:1;stroke-dasharray:3 3}
.shell .proton{fill:#ff6b6b;stroke:#7a1d1d;stroke-width:.5}.shell .neutron{fill:#c9ced8;stroke:#555;stroke-width:.5}
.shell .spin{animation:lspin 8s linear infinite}
.shell .lel{transition:opacity .4s,fill .4s}
.shell.count .ein .lel{opacity:.2}
.shell.count .eout .lel{fill:#20d3a7}
@keyframes lspin{to{transform:rotate(360deg)}}
@keyframes lbob{50%{transform:translateY(-6px)}}
@keyframes lwig{25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(12deg) scale(1.1)}}
@keyframes lspark{from{transform:scale(.3);opacity:1}to{transform:scale(2.4);opacity:0}}
@keyframes lrise{from{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:none}80%{opacity:1}to{opacity:0;transform:translateY(-10px)}}
@keyframes lfade{from{opacity:0}}
@keyframes lshake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes lpulse{50%{box-shadow:0 0 18px var(--acc2)}}
@media (max-width:420px){.lhead{gap:8px}.lhead b{font-size:14px}.ldots{gap:4px;flex-wrap:nowrap}.ldot{width:9px;height:9px}}
@media (prefers-reduced-motion:reduce){.shell .spin,.lmol,.lnav .lnext.go{animation:none}}

<circle class="mote" cx="455" cy="665" r="1.6" fill="#ffe8b0" opacity=".5" style="animation-delay:2.1s;animation-duration:8.7s"/>
<circle class="mote" cx="97" cy="897" r="1.9" fill="#ffe8b0" opacity=".5" style="animation-delay:7.3s;animation-duration:11.7s"/>
<circle class="mote" cx="142" cy="726" r="2.7" fill="#ffe8b0" opacity=".5" style="animation-delay:7.8s;animation-duration:9.6s"/>
<rect width="1600" height="1000" fill="url(#lvig)"/></svg></div>
<canvas id="c"></canvas>
<div id="measures"></div>

<div id="top" class="bar">
  <div class="left"><span class="brand">QuMol</span><span id="info" class="pill">Loading…</span></div>
  <div class="right">
    <button id="puzzleBtn" class="tip-below hidden" data-tip="Puzzles: build a named molecule as close to its experimental 3D structure as you can. Five new daily puzzles, plus random ones" aria-label="Puzzles">🧩</button>
    <button id="cookBtn" class="tip-below hidden" data-tip="Cauldron: drop C, N and O atoms in, light the fire and watch them bond on their own. Then build what you cooked" aria-label="Cauldron (cooking mode)"></button>
    <button id="plotBtn" class="tip-below" data-tip="Optimization plots: energy and max force at every step of your last build, live while it runs" aria-label="Optimization plots">📈</button>
    <button id="xyzBtn" class="tip-below" data-tip="Formula and XYZ coordinates panel. Edit the coordinates to change the molecule directly" aria-label="Formula and XYZ panel">XYZ</button>
    <button id="mute" class="tip-below" data-tip="Sound on/off" aria-label="Sound on/off">🔊</button>
    <button id="help" class="tip-below" data-tip="How to play, and the interactive tutorial" aria-label="How to play">?</button>
    <button id="lb" class="tip-below" data-tip="Leaderboards" aria-label="Leaderboards">🏆</button>
    <button id="total" class="tip-below tip-right" data-tip="Your score and molecule collection" aria-label="Your score and molecule collection">0 ⭐</button>
  </div>
</div>

<div id="bottom" class="bar">
  <div class="row" id="els"></div>
  <div class="row">
    <button class="mode on ico" data-mode="add" data-tip="Add: click an element button to drop an atom next to the molecule, or tap an atom to grow the selected element from it. Tap a bond to change single → double → triple">➕ Add</button>
    <button class="mode ico" data-mode="bond" data-tip="Bond: tap two atoms to connect them (great for closing rings); tapping the same pair again cycles single → double → triple → no bond. Tap a bond directly to change its order">🔗 Bond</button>
    <button class="mode ico" data-mode="move" data-tip="Move: drag an atom to fine-tune the geometry. The closer to the optimum, the more points">✋ Move</button>
    <button class="mode ico" data-mode="delete" data-tip="Delete: tap an atom to remove it (with its hydrogens), or tap a bond to break it">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M9 6V4h6v2"/><path d="M5 6l1.2 14h11.6L19 6"/><path d="M10 11l4 5M14 11l-4 5"/></svg>Delete</button>
  </div>
  <div class="row">
    <button id="hplus" data-tip="Saturate with hydrogens: every atom with free bonds gets H atoms until it has its full valence (C 4, N 3, O 2, S 2). Build does this automatically">H+</button>
    <button id="undo" class="ico" data-tip="Undo: step back one change">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button>
    <button id="clear" class="ico" data-tip="Reset: remove the whole molecule and start over (Undo brings it back)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>Reset</button>
    <button id="measure" class="ico" data-tip="Measure: show bond lengths (Å) on the bonds and the bond angles (°) around the atom you tap or drag. Updates live while you move atoms" aria-label="Measure bond lengths and angles">📏 Measure</button>
    <button id="submit" class="ico tip-right" data-tip="Build: your molecule is optimized, checked for stability and scored" aria-label="Build">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v6.2L4.6 18.6A1.6 1.6 0 0 0 6 21h12a1.6 1.6 0 0 0 1.4-2.4L14 9.2V3"/><path d="M7.2 15h9.6"/><circle cx="10.5" cy="18" r="0.6" fill="currentColor"/><circle cx="13.6" cy="17.2" r="0.5" fill="currentColor"/></svg><span id="submitLabel">Build</span></button>
  </div>
</div>

<aside id="xyzPanel" class="hidden" aria-label="Formula and coordinates">
  <div class="phead">
    <div><div id="pFormula" class="pformula">—</div><div id="pSmiles" class="psmiles"></div></div>
    <button id="xyzClose" class="tip-below tip-right" data-tip="Hide panel" aria-label="Hide panel">✕</button>
  </div>
  <textarea id="xyzText" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="XYZ coordinates"></textarea>
  <div id="xyzMsg" class="pmsg">Edit coordinates (Å) to change the molecule. Add or remove lines to add or remove atoms.</div>
</aside>

<aside id="plotPanel" class="hidden" aria-label="Optimization plots">
  <div class="phead">
    <div><h3>📈 Optimization</h3><div id="plotMeta">Build a molecule to see how its energy and forces change at every optimization step.</div></div>
    <button id="plotClose" class="tip-below" data-tip="Hide panel" aria-label="Hide panel">✕</button>
  </div>
  <div id="plotCharts"></div>
</aside>

<div id="puzzleBar" class="hidden" role="status">
  <div class="pzrow"><span id="pzTitle"></span><span id="pzTimer">0:00</span>
    <button id="pzExit" class="tip-right" data-tip="Leave the puzzle and get your own molecule back" aria-label="Exit puzzle">✕</button></div>
  <div id="pzSub"></div>
</div>
<div id="kitchen" class="hidden" role="region" aria-label="Kitchen"></div>
<div id="shaker" class="hidden" aria-hidden="true">🧂</div>
<div id="toast"></div>
<div id="badgePop" role="status"></div>
<div id="optInfo" class="hidden" aria-live="polite"></div>
<div id="ov" class="hidden"><div class="card" id="card"></div></div>

<script type="module" src="app.js"></script>
</body>
</html>
